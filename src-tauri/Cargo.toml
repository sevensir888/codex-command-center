[package]
name = "codex-command-center"
version = "0.1.0"
description = "A local desktop control center for Codex engineering work."
authors = ["Codex Command Center contributors"]
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
walkdir = "2"
which = "6"
