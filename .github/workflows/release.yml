name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows packages
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Rust path remapping
        shell: pwsh
        run: |
          "RUSTFLAGS=--remap-path-prefix=$env:GITHUB_WORKSPACE=. --remap-path-prefix=$env:USERPROFILE=~" >> $env:GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Validate frontend
        run: npm run build

      - name: Lightweight secret scan
        run: npm run check:secrets

      - name: Rust format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Build Tauri application
        run: npm run tauri:build

      - name: Create checksums
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/release/bundle"
          $standalone = Get-Item -LiteralPath "src-tauri/target/release/codex-command-center.exe"
          $bundleArtifacts = Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in ".exe", ".msi", ".zip" }
          $artifacts = @($standalone) + @($bundleArtifacts)
          if (-not $artifacts) {
            throw "No Windows release artifacts were found."
          }
          $lines = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($artifact.Name)"
          }
          $lines | Set-Content -LiteralPath "$bundle/SHA256SUMS.txt" -Encoding utf8

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/codex-command-center.exe
            src-tauri/target/release/bundle/SHA256SUMS.txt
